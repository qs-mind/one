# Checks every push to main and every pull request on Linux, Windows and macOS: types, ruff and
# clippy (`npm run check`), then the core's and the screen's tests. Changes to *.md files alone skip it.
# Actions are pinned to commit SHAs; the comment names the release.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libxdo-dev libssl-dev

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/pyproject.toml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # rustup reads the version and components from rust-toolchain.toml.
      - name: Rust from rust-toolchain.toml
        run: rustup toolchain install && rustc --version

      # Only main writes the cache; pull requests read main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The npm scripts find the core's Python at core/.venv (bin/python, or Scripts/python.exe on Windows).
      - name: Core in core/.venv
        run: |
          python -m venv core/.venv
          if [ "$RUNNER_OS" = Windows ]; then py=core/.venv/Scripts/python.exe; else py=core/.venv/bin/python; fi
          "$py" -m pip install -e "./core[dev]"

      - run: npm ci
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:ui
