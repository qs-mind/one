# Checks every push to main, to a check/* branch (scripts/push-checked.sh: main is pushed only after it
# passes there) and every pull request on Linux, Windows and macOS: types, ruff and
# clippy (`npm run check`), then the core's and the screen's tests; and the screen end to end in Chromium and
# WebKit on Linux (`e2e`). Changes to *.md files alone skip it. Run by hand with update-snapshots, it makes the
# screenshot baselines (the Ubuntu runner is their reference) and uploads them: `gh run download`, then commit.
# Actions are pinned to commit SHAs; the comment names the release.
name: CI

on:
  push:
    branches: [main, "check/**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: Make the screenshot baselines again (runs only the e2e job)
        type: boolean
        default: false

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    if: ${{ !inputs.update-snapshots }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf build-essential libxdo-dev libssl-dev

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: core/requirements.lock

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # rustup reads the version and components from rust-toolchain.toml.
      - name: Rust from rust-toolchain.toml
        run: rustup toolchain install && rustc --version

      - name: Build and test ONE's drawing reader
        run: |
          cargo test --manifest-path drawings/Cargo.toml --locked -j 4
          cargo build --manifest-path drawings/Cargo.toml --locked --release -j 4

      # Only main writes the cache; pull requests read main's.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The npm scripts find the core's Python at core/.venv (bin/python, or Scripts/python.exe on Windows).
      # The exact versions and their hashes come from the universal lock; the core itself is added without resolving
      # again.
      - name: Core in core/.venv
        run: |
          python -m venv core/.venv
          if [ "$RUNNER_OS" = Windows ]; then py=core/.venv/Scripts/python.exe; else py=core/.venv/bin/python; fi
          "$py" -m pip install --require-hashes -r core/requirements.lock
          "$py" -m pip install --no-deps -e "./core[dev]"

      - run: npm ci
      - run: npm run check
      - run: npm run test:core
      - run: npm run test:ui

  # The built screen in Chromium and WebKit, every /api call answered by the tests' fixtures: no core, no network.
  # Screenshots are compared here only (Chromium on Ubuntu is their reference), once their baselines are committed.
  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- ${{ inputs.update-snapshots && '--update-snapshots' || '' }}

      - name: Test results, when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

      - name: Screenshot baselines
        if: ${{ inputs.update-snapshots }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-baselines
          path: ui/e2e/screens.spec.ts-snapshots/
          retention-days: 7
