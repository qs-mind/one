[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsone"
version = "0.1.0"
description = "QS Mind One core: local agent server for the desktop app"
license = "LicenseRef-FSL-1.1-ALv2"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai-slim[anthropic]",
  "anthropic",
  "fastapi",
  "uvicorn",
  "keyring",
  "sqlcipher3-wheels",
  "sqlite-vec",
  "pypdfium2",
  "openpyxl",
  "xlrd",
  "platformdirs",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "xlwt"]

[tool.hatch.build.targets.wheel]
packages = ["qsone"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
