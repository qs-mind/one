[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qsone"
version = "0.1.0"
description = "QS Mind One core: local agent server for the desktop app"
license = "LicenseRef-FSL-1.1-ALv2"
requires-python = ">=3.12,<3.13"
# Licences: permissive only (MIT, BSD, Apache-2.0, zlib, public domain), plus MPL-2.0 for
# unmodified packages: tqdm (MPL-2.0 AND MIT) comes in via tokenizers -> huggingface-hub,
# and nothing imports it. On Windows only, mcp needs pywin32 (PSF-2.0, permissive, like Python
# itself).
dependencies = [
  "pydantic-ai-slim[anthropic]",
  "anthropic",
  "openai",  # the Standard Link: any OpenAI-compatible provider
  "mcp",  # One's tools served to the engineer's own Claude Code
  # mcp needs cryptography (through pyjwt), whose wheels for Intel Macs stop at 48.
  # Elsewhere keep the newer one that the key store already used on Linux.
  "cryptography<49 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "cryptography>=50 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "genai-prices",  # the Model Data Sheet's prices and their source
  "fastapi",
  "uvicorn",
  "keyring",
  "sqlcipher3-wheels",
  "sqlite-vec",
  "pypdfium2",  # Apache-2.0 / BSD-3-Clause; PDF reading and revision page renders
  "pdfplumber",  # MIT; PDF BOQ tables; brings pdfminer.six (MIT)
  "pypdf>=6.2",  # BSD-3-Clause; tender pack assembly
  "pdf-inspector",  # MIT; PDF page types, headings and tables for the Project Map
  "shapely",  # BSD-3-Clause; room areas from drawing outlines
  "pyhanko",  # MIT; local PDF integrity seal
  "pyhanko-certvalidator",  # MIT; the seal certificate store
  "asn1crypto",  # MIT; in-memory seal key and certificate encoding
  "openpyxl",
  "xlrd",
  "platformdirs",
  # Search by meaning. onnxruntime ships no Intel Mac wheel: there, search is by words only.
  "onnxruntime ; sys_platform != 'darwin' or platform_machine == 'arm64'",
  "tokenizers",
  "numpy",  # BSD-3-Clause; search vectors and in-memory revision overlays
  "truststore",  # MIT; HTTPS with the system's certificates (the model download, the account)
  "httpx",  # BSD-3-Clause; the model download, the QS Mind account and Usage Stats (Plan 8)
  "pyjwt",  # MIT; checks the QS Mind account's ID token (Plan 8), already there through mcp
  "python-docx",  # Word export (Plan 6); brings lxml (BSD-3-Clause)
  "typst",  # PDF export (Plan 6): typst-py, Apache-2.0, abi3 wheels for every CI system
  # Tools (Plan 5): web pages to Markdown, and the Sandbox's WebAssembly runtime.
  "beautifulsoup4",  # MIT; brings soupsieve (MIT)
  "markdownify",  # MIT
  "wasmtime",  # wasmtime-py, Apache-2.0 WITH LLVM-exception; wheels for every CI system
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "xlwt", "pyyaml"]  # pyyaml (MIT): the command line's walk files

[tool.hatch.build.targets.wheel]
packages = ["qsone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: real AI, off by default"]
anyio_mode = "auto"  # `async def` tests run on asyncio (anyio's own pytest plugin)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["E", "F", "I", "UP", "B", "PLW1514"]
