[package]
name = "qs-mind-one"
version = "0.1.0"
description = "QS Mind ONE desktop window"
edition = "2024"
license-file = "../LICENSE.md"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"  # a second One focuses the first instead of opening another window
tauri-plugin-window-state = "2"  # remembers the window's size and position
tauri-plugin-dialog = "=2.8.1"  # the native Save dialog for exports, and the folder picker (MIT OR Apache-2.0)
tauri-plugin-updater = "=2.14.1"  # signed updates from the feed in tauri.release.conf.json, checked against its public key (MIT OR Apache-2.0)
ureq = { version = "3.5", default-features = false }  # carries the page's calls to the core: plain http on 127.0.0.1, so no TLS or gzip (MIT OR Apache-2.0)
getrandom = "0.3"  # the core's launch secret (MIT OR Apache-2.0)
serde_json = "1"  # the shim's head and end events, and the core's status (MIT OR Apache-2.0)

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # stops the core's whole process group (MIT OR Apache-2.0)

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }  # a job that ends the core and its children with One (MIT OR Apache-2.0)
